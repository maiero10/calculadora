<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora</title>
</head>
<body>
    <div class="container">
        <div class="visor-box">
            <input type="text" class="visor" id="visor" autocomplete="off" placeholder="0" inputmode="none">
        </div>

        <div class="botoes-box">
            <button id="limpar-btn">CE</button>
            <button id="quadrado-btn">x²</button>
            <button id="multiplicacao-btn"><i class="fa-solid fa-xmark"></i></button>
            <button id="delete-btn"><i class="fa-solid fa-delete-left"></i></button>
            <button id="um-btn" class="btn-num">1</button>
            <button id="dois-btn" class="btn-num">2</button>
            <button id="tres-btn" class="btn-num">3</button>
            <button id="divisao-btn"><i class="fa-solid fa-divide"></i></button>
            <button id="quatro-btn" class="btn-num">4</button>
            <button id="cinco-btn" class="btn-num">5</button>
            <button id="seis-btn" class="btn-num">6</button>
            <button id="subtracao-btn"><i class="fa-solid fa-minus"></i></button>
            <button id="sete-btn" class="btn-num">7</button>
            <button id="oito-btn" class="btn-num">8</button>
            <button id="nove-btn" class="btn-num">9</button>
            <button id="soma-btn"><i class="fa-solid fa-plus"></i></button>
            <button id="mais-menos-btn"><i class="fa-solid fa-plus-minus"></i></button>
            <button id="zero-btn" class="btn-num">0</button>
            <button id="virgula-btn">,</button>
            <button id="igual-btn"><i class="fa-solid fa-equals"></i></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!--calculadora 4x5-->
